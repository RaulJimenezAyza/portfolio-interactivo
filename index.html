<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Raúl Jiménez Ayza · La Isla del Gato — portfolio jugable 3D</title>
<meta name="description" content="La Isla del Gato: el portfolio jugable de Raúl Jiménez Ayza. Explora una isla con 8 templos, físicas reales y un gato protagonista. Gameplay & fullstack engineer." />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0a0c; --panel:#0d0d10; --line:#1c1c21; --line2:#2c2c32;
    --ink:#ecebe8; --dim:#b6b3ac; --mut:#8f8d87; --faint:#5c5a55;
    --green:#7fdca8; --amber:#e8b06a; --sky:#12233a; --gold:#ffd76a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
  body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);touch-action:none}
  canvas{display:block}
  a{color:var(--green);text-decoration:none}
  ::selection{background:var(--green);color:#0a0a0c}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes floatUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}

  #scene{position:fixed;inset:0;z-index:0}

  /* top HUD */
  #hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:flex-start;justify-content:space-between;
    gap:16px;padding:16px 20px;pointer-events:none}
  .brand{pointer-events:auto;background:#0b0b0ecc;backdrop-filter:blur(6px);border:1px solid var(--line2);border-radius:4px;padding:10px 14px}
  .brand .tag{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;color:var(--green)}
  .brand .name{font-size:14px;font-weight:600;margin-top:2px}
  .brand .role{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--mut);letter-spacing:.08em;margin-top:3px}
  .hud-right{display:flex;gap:8px;pointer-events:auto}
  .hbtn{padding:9px 14px;border:1px solid var(--line2);background:#0b0b0ecc;backdrop-filter:blur(6px);color:var(--ink);
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:4px;transition:.15s}
  .hbtn:hover{border-color:var(--green);color:var(--green)}

  /* controls legend */
  #legend{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;display:flex;gap:16px;align-items:center;
    padding:10px 16px;border:1px solid var(--line2);background:#0b0b0ecc;backdrop-filter:blur(8px);border-radius:6px;
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut);pointer-events:none;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px);
    transition:opacity .45s ease,transform .45s ease}
  /* the cheat sheet steps aside once you have read it; the ? button brings it back */
  #legend.hide{opacity:0;transform:translateX(-50%) translateY(14px)}
  .hbtn.on{border-color:var(--green);color:var(--green)}
  #legend .grp{display:flex;align-items:center;gap:7px}
  #legend .key{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border:1px solid var(--line2);
    border-radius:3px;background:#101014;color:var(--ink);font-size:10px}
  #legend b{color:var(--dim);font-weight:400}

  /* proximity prompt */
  #prompt{position:fixed;left:50%;top:62%;transform:translateX(-50%);z-index:20;display:none;pointer-events:none;
    padding:14px 22px;border:1px solid var(--green);background:#0b0f0cdd;backdrop-filter:blur(8px);border-radius:6px;text-align:center;
    animation:pop .18s ease both;max-width:min(480px,90vw)}
  #prompt.show{display:block}
  #prompt .k{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--green);text-transform:uppercase}
  #prompt .t{margin-top:6px;font-size:19px;font-weight:700}
  #prompt .l{margin-top:7px;font-size:13px;line-height:1.5;color:var(--dim);font-style:italic}
  #prompt .o{margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut)}

  /* counters cluster */
  #counters{position:fixed;left:20px;bottom:18px;z-index:20;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  #counters .box{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut);
    border:1px solid var(--line2);background:#0b0b0ecc;backdrop-filter:blur(6px);border-radius:6px;padding:7px 12px}
  #counters b{color:var(--gold);font-size:14px}
  #speed b{color:var(--green);font-size:15px}
  #toast{position:fixed;left:50%;top:88px;transform:translateX(-50%);z-index:25;pointer-events:none;text-align:center;
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink);background:#0b0b0edd;border:1px solid var(--line2);
    padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .3s;max-width:min(520px,92vw)}
  #toast.show{opacity:1}

  /* touch controls */
  #touch{position:fixed;inset:0;z-index:22;display:none;pointer-events:none}
  body.touch #touch{display:block}
  body.touch #counters{bottom:150px}
  .pad{position:absolute;bottom:26px;display:grid;gap:8px;pointer-events:auto}
  #padL{left:22px;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px)}
  #padR{right:22px;grid-template-columns:repeat(2,60px)}
  .tbtn{width:100%;height:56px;border:1px solid var(--line2);background:#0b0b0ecc;backdrop-filter:blur(6px);color:var(--ink);
    border-radius:10px;font-size:20px;display:grid;place-items:center;user-select:none;touch-action:none}
  .tbtn:active{border-color:var(--green);color:var(--green);background:#0e130fcc}
  #padL .up{grid-column:2;grid-row:1}#padL .lft{grid-column:1;grid-row:2}#padL .dn{grid-column:2;grid-row:2}#padL .rgt{grid-column:3;grid-row:2}
  #padR .tbtn{height:60px;font-family:'JetBrains Mono',monospace;font-size:12px}

  /* intro / start */
  #intro{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 40%,#12233a 0%,#0a0a0c 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:28px;transition:opacity .6s ease}
  #intro.hide{opacity:0;pointer-events:none}
  #intro .kick{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.24em;color:var(--green);text-transform:uppercase}
  #intro h1{margin:6px 0 0;font-size:clamp(36px,7vw,78px);line-height:.98;font-weight:700;letter-spacing:-.03em}
  #intro p{margin:4px 0 0;max-width:600px;font-size:16px;line-height:1.6;color:var(--dim)}
  #intro .ring{width:44px;height:44px;border:2px solid #26313f;border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite}
  #startBtn{margin-top:6px;padding:15px 30px;border:1px solid var(--green);background:transparent;color:var(--green);
    font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-radius:5px;transition:.15s;display:none}
  #startBtn.show{display:inline-block}
  #startBtn:hover{background:var(--green);color:#0a0a0c}
  #intro .mini{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut);letter-spacing:.06em;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  #intro .mini span{border:1px solid var(--line2);border-radius:4px;padding:6px 10px}
  #introErr{color:var(--amber);font-size:13px;max-width:420px;display:none}

  /* modal (projects) */
  .ov{position:fixed;inset:0;z-index:70;background:#05050799;backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:24px}
  .ov.show{display:flex}
  #modal .box{position:relative;width:min(720px,100%);max-height:86vh;overflow:auto;border:1px solid var(--line2);background:var(--panel);animation:floatUp .25s ease both;border-radius:6px}
  /* The crest used to be a flat block of the project colour with near-black
     text on it, which made the pink and cyan projects unreadable. It is now a
     dark panel with the colour used only as a glow behind big initials. */
  #modal .shot{position:relative;height:150px;display:grid;place-items:center;overflow:hidden;
    background:#0b0b0e;border-bottom:1px solid #1f1f25}
  #modal .shot::before{content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse 46% 62% at 50% 132%,var(--accent) 0%,transparent 72%);opacity:.5}
  /* a faint grid plus a dark veil: the accent should read as a glow rising
     from the bottom edge, never as a flat swatch that swallows the initials */
  #modal .shot::after{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(90deg,#ffffff0a 0 1px,transparent 1px 34px),
               repeating-linear-gradient(0deg,#ffffff0a 0 1px,transparent 1px 34px),
               linear-gradient(180deg,rgba(11,11,14,.82) 0%,rgba(11,11,14,.35) 55%,rgba(11,11,14,.7) 100%)}
  #modal .shot span{position:relative;z-index:1;font-family:'JetBrains Mono',monospace;font-weight:700;
    font-size:52px;letter-spacing:.14em;color:var(--ink);
    text-shadow:0 0 28px var(--accent),0 2px 12px rgba(0,0,0,.8)}
  /* NOT .pad — the touch d-pad owns that class globally and would force
     position:absolute onto this block, collapsing the whole modal. */
  #modal .mbody{padding:30px 32px 34px}
  #modal .mbody .k{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
  #modal h3{margin:12px 0 0;font-size:30px;font-weight:700;letter-spacing:-.02em}
  #modal .b{margin:16px 0 0;font-size:16px;line-height:1.7;color:var(--dim)}
  #modal .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
  #modal .tag{padding:6px 11px;border:1px solid #26262b;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut)}
  #modal .acts{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
  .btn{padding:12px 20px;border:1px solid var(--line2);color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;cursor:pointer;background:transparent;border-radius:4px;transition:.15s}
  .btn.primary{border-color:var(--green);color:var(--green)}
  .btn.primary:hover{background:var(--green);color:#0a0a0c}
  .btn.ghost:hover{border-color:var(--faint);color:var(--ink)}

  /* info / CV overlay */
  #info .box{position:relative;width:min(920px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line2);background:var(--panel);border-radius:8px;animation:floatUp .3s ease both}
  #info .inner{padding:clamp(24px,4vw,52px)}
  #info h2{font-size:clamp(24px,3.4vw,40px);font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
  #info .num{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
  #info section{padding:34px 0;border-top:1px solid var(--line)}
  #info section:first-of-type{border-top:0;padding-top:8px}
  #info p{font-size:16px;line-height:1.7;color:var(--dim);text-wrap:pretty}
  #info .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;margin-top:26px;background:var(--line);border:1px solid var(--line)}
  #info .stat{padding:18px;background:var(--panel)}
  #info .stat .v{font-family:'JetBrains Mono',monospace;font-size:28px}
  #info .stat .c{margin-top:6px;font-size:12px;color:var(--mut);line-height:1.4}
  #info .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:22px}
  #info .card{border:1px solid #1f1f25;background:#0c0c0f;border-radius:6px;padding:20px;cursor:pointer;transition:.18s}
  #info .card:hover{border-color:#3a3a42;transform:translateY(-2px)}
  #info .card .meta{display:flex;align-items:center;gap:9px}
  #info .card .sw{width:7px;height:7px}
  #info .card .kd{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
  #info .card .t{margin-top:10px;font-size:18px;font-weight:700}
  #info .card .bl{margin-top:8px;font-size:13px;line-height:1.5;color:var(--mut)}
  #info .skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;margin-top:22px;background:var(--line);border:1px solid var(--line)}
  #info .skillcol{padding:22px;background:var(--panel)}
  #info .skillcol .lbl{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  #info .chips{margin-top:14px;display:flex;flex-wrap:wrap;gap:7px}
  #info .chip{padding:6px 11px;border:1px solid #26262b;font-size:13px;color:var(--dim);border-radius:3px}
  #info .tl{display:grid;grid-template-columns:120px 1fr;gap:24px;padding:20px 0;border-top:1px solid var(--line)}
  #info .tl:first-child{border-top:0}
  #info .tl .when{font-family:'JetBrains Mono',monospace;font-size:12px}
  #info .tl .role{font-size:18px;font-weight:700}
  #info .tl .place{margin-top:3px;font-size:13px;color:var(--mut)}
  #info .tl .det{margin-top:8px;font-size:14px;line-height:1.6;color:var(--dim)}
  #info .links{display:flex;flex-direction:column;gap:2px;font-family:'JetBrains Mono',monospace;font-size:13px;margin-top:18px}
  #info .links a,#info .links div{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
  #info .links a{color:var(--ink)}#info .links a:hover{color:var(--green)}
  #info .links .lab{color:var(--faint)}
  #info .close{position:sticky;top:0;float:right;margin:14px 14px 0 0}
  /* ---- Mastermind minigame ---- */
  #mm .box{position:relative;width:min(560px,100%);max-height:92vh;overflow:auto;border:1px solid var(--line2);
    background:var(--panel);border-radius:8px;animation:floatUp .25s ease both}
  #mm .inner{padding:clamp(20px,3.5vw,32px)}
  #mm .num{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;color:#f2a2c4;text-transform:uppercase}
  #mm h2{margin:8px 0 0;font-size:clamp(22px,3vw,32px);font-weight:700;letter-spacing:-.02em}
  #mm .hint{margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--dim)}
  #mm .rows{margin-top:20px;display:flex;flex-direction:column;gap:6px}
  #mm .row{display:flex;align-items:center;gap:12px;padding:6px 10px;border:1px solid #1a1a1f;border-radius:6px;background:#0a0a0d}
  #mm .row.live{border-color:#3d3d46;background:#101015}
  #mm .row .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--faint);width:18px}
  #mm .slots{display:flex;gap:7px}
  #mm .pegs{display:grid;grid-template-columns:repeat(2,10px);gap:3px;margin-left:auto}
  #mm .peg{width:10px;height:10px;border-radius:50%;border:1px solid #33333c}
  #mm .peg.hit{background:var(--green);border-color:var(--green)}
  #mm .peg.near{background:transparent;border-color:var(--ink);box-shadow:inset 0 0 0 2px #55555f}
  /* Each colour also carries a glyph so the board stays readable for
     colour-blind players and at small sizes. */
  #mm .slot{width:34px;height:34px;border-radius:8px;border:1px solid #2c2c34;background:#141419;
    display:grid;place-items:center;font-size:16px;font-weight:700;color:#0a0a0c;line-height:1;user-select:none}
  #mm .slot.empty{color:#3a3a44;font-size:12px}
  #mm .palette{margin-top:22px;display:flex;flex-wrap:wrap;gap:9px}
  #mm .pick{width:46px;height:46px;border-radius:10px;border:2px solid transparent;cursor:pointer;
    display:grid;place-items:center;font-size:19px;font-weight:700;color:#0a0a0c;position:relative;transition:.12s}
  #mm .pick:hover{transform:translateY(-2px)}
  #mm .pick i{position:absolute;bottom:2px;right:5px;font-style:normal;font-size:9px;opacity:.55;
    font-family:'JetBrains Mono',monospace}
  #mm .acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center}
  #mm .status{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);margin-left:auto}
  #mm .btn[disabled]{opacity:.35;cursor:not-allowed}
  #mm .done{margin-top:18px;padding:16px;border-radius:6px;border:1px solid var(--line2);background:#0a0a0d;display:none}
  #mm .done.show{display:block}
  #mm .done b{display:block;font-size:18px;margin-bottom:6px}
  #mm .done p{margin:0;font-size:14px;line-height:1.6;color:var(--dim)}

  @media(max-width:640px){ #info .tl{grid-template-columns:1fr;gap:6px} #legend{font-size:10px;gap:10px} .brand .role{display:none}
    #mm .slot{width:28px;height:28px} #mm .pick{width:40px;height:40px} }
</style>
</head>
<body data-lang="es">
  <div id="scene"></div>

  <div id="hud">
    <div class="brand">
      <div class="tag">RJA · GAMEPLAY + FULLSTACK</div>
      <div class="name">Raúl Jiménez Ayza</div>
      <div class="role" data-i18n="role"></div>
    </div>
    <div class="hud-right">
      <button class="hbtn" id="helpBtn">?</button>
      <button class="hbtn" id="audioBtn" title="audio">♪</button>
      <button class="hbtn" id="langBtn">EN</button>
      <button class="hbtn" id="infoBtn" data-i18n="infoBtn"></button>
    </div>
  </div>

  <div id="legend">
    <div class="grp"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span><b data-i18n="legDrive"></b></div>
    <div class="grp"><span class="key">⇧</span><b data-i18n="legBoost"></b></div>
    <div class="grp"><span class="key">Space</span><b data-i18n="legBrake"></b></div>
    <div class="grp"><span class="key">E</span><b data-i18n="legOpen"></b></div>
    <div class="grp"><span class="key">G</span><b data-i18n="legPlay"></b></div>
    <div class="grp"><span class="key">H</span><b data-i18n="legHonk"></b></div>
    <div class="grp"><span class="key">R</span><b data-i18n="legReset"></b></div>
  </div>

  <div id="counters">
    <div class="box" id="speed"><b id="speedV">0</b> <span data-i18n="kmh">vel</span></div>
    <div class="box" id="fishHud"></div>
    <div class="box" id="zoneHud"></div>
  </div>
  <div id="toast"></div>

  <div id="prompt">
    <div class="k" data-i18n="promptK"></div>
    <div class="t" id="promptT"></div>
    <div class="l" id="promptL"></div>
    <div class="o" id="promptO"></div>
  </div>

  <div id="touch">
    <div class="pad" id="padL">
      <div class="tbtn up" data-k="w">▲</div><div class="tbtn lft" data-k="a">◀</div>
      <div class="tbtn dn" data-k="s">▼</div><div class="tbtn rgt" data-k="d">▶</div>
    </div>
    <div class="pad" id="padR">
      <div class="tbtn" data-k=" ">JUMP</div><div class="tbtn" data-k="e">OPEN</div>
      <div class="tbtn" data-k="shift">RUN</div><div class="tbtn" data-k="h">MEOW</div>
      <div class="tbtn" data-k="g">PLAY</div><div class="tbtn" data-k="r">RESET</div>
    </div>
  </div>

  <div id="intro">
    <div class="ring" id="introRing"></div>
    <div class="kick" data-i18n="introKick"></div>
    <h1 data-i18n="introTitle"></h1>
    <p data-i18n="introBody"></p>
    <div class="mini">
      <span data-i18n="miniDrive"></span><span data-i18n="miniOpen"></span><span data-i18n="miniFish"></span><span data-i18n="miniHonk"></span><span>🔊 con sonido</span>
    </div>
    <button id="startBtn" data-i18n="startBtn"></button>
    <div id="introErr"></div>
  </div>

  <div id="modal" class="ov">
    <div class="box">
      <div class="shot" id="mShot"><span>▚▚▚</span></div>
      <div class="mbody">
        <div class="k" id="mKind"></div>
        <h3 id="mTitle"></h3>
        <p class="b" id="mBody"></p>
        <div class="tags" id="mTags"></div>
        <div class="acts">
          <button id="mPlay" class="btn primary" style="display:none"></button>
          <a id="mLink" class="btn primary" target="_blank" rel="noopener"></a>
          <button id="mClose" class="btn ghost"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="mm" class="ov">
    <div class="box"><div class="inner">
      <div class="num" id="mmKicker"></div>
      <h2 id="mmTitle"></h2>
      <p class="hint" id="mmHint"></p>
      <div class="rows" id="mmRows"></div>
      <div class="palette" id="mmPalette"></div>
      <div class="acts">
        <button class="btn primary" id="mmCheck"></button>
        <button class="btn ghost" id="mmClear"></button>
        <button class="btn ghost" id="mmClose"></button>
        <span class="status" id="mmStatus"></span>
      </div>
      <div class="done" id="mmDone"><b id="mmDoneT"></b><p id="mmDoneB"></p></div>
    </div></div>
  </div>

/* ---------- input ---------- */
const KEYS = {};
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  /* the minigame owns the keyboard while it is up, so the cat does not
     wander off behind the overlay */
  if (state.minigame) { KEYS[k] = false; return; }
  KEYS[k] = true;
  if (k === "escape") { if (state.activeProject != null) closeProject(); else closeInfo(); }
  if (k === "e") interact();
  if (k === "g") tryOpenMinigame();
  if (k === "h") Snd.meow();
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) e.preventDefault();
});
addEventListener("keyup", e => { KEYS[e.key.toLowerCase()] = false; });
$$("#touch .tbtn").forEach(btn => {
  const k = btn.dataset.k;
  const down = e => {
    e.preventDefault();
    if (k === "e") interact();
    else if (k === "h") Snd.meow();
    else if (k === "g") tryOpenMinigame();
    else if (k === "r") { if (game) game.reset(); }
    else KEYS[k] = true;
  };
  const up = e => { e.preventDefault(); if (!["e", "h", "g", "r"].includes(k)) KEYS[k] = false; };
  btn.addEventListener("touchstart", down, { passive: false });
  btn.addEventListener("touchend", up, { passive: false });
  btn.addEventListener("mousedown", down);
  btn.addEventListener("mouseup", up);
  btn.addEventListener("mouseleave", up);
});


/* ============================================================
   SOUND — everything is synthesised at runtime with Web Audio.
   No audio files: the page has to stay a single self-contained
   HTML, so the music is generated by a step sequencer and the
   effects are built from oscillators and noise buffers.
   ============================================================ */
const Snd = {
  ctx: null, master: null, musicBus: null, sfxBus: null, revSend: null,
  on: true, started: false, noiseBuf: null,
  zone: "default", zoneGoal: "default",
  bar: 0, step: 0, nextTime: 0, timer: null, duckT: 0,

  /* --- setup ------------------------------------------------ */
  init() {
    if (this.ctx) return this.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    const ctx = this.ctx = new AC();

    /* master -> soft limiter -> out, so stacked voices never clip */
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 22;
    comp.ratio.value = 5; comp.attack.value = .004; comp.release.value = .22;
    this.master = ctx.createGain();
    this.master.gain.value = this.on ? .9 : 0;
    this.master.connect(comp); comp.connect(ctx.destination);

    /* a generated impulse response gives everything a shared space */
    const rev = ctx.createConvolver();
    rev.buffer = this.impulse(2.6, 2.4);
    const revGain = ctx.createGain(); revGain.gain.value = .9;
    rev.connect(revGain); revGain.connect(this.master);
    this.revSend = rev;

    this.musicBus = ctx.createGain(); this.musicBus.gain.value = .34;
    this.sfxBus = ctx.createGain(); this.sfxBus.gain.value = .85;
    this.musicBus.connect(this.master); this.sfxBus.connect(this.master);

    this.noiseBuf = this.noise(2);
    this.buildAmbience();
    return ctx;
  },

  impulse(sec, decay) {
    const ctx = this.ctx, len = Math.floor(ctx.sampleRate * sec);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++)
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  },
  noise(sec) {
    const ctx = this.ctx, len = Math.floor(ctx.sampleRate * sec);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {          // brown-ish: softer than white
      const w = Math.random() * 2 - 1;
      last = (last + .02 * w) / 1.02;
      d[i] = last * 3.5;
    }
    return buf;
  },

  /* --- constant sea + wind bed ------------------------------ */
  buildAmbience() {
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf; src.loop = true;

    const sea = ctx.createBiquadFilter();
    sea.type = "lowpass"; sea.frequency.value = 420; sea.Q.value = .6;
    const seaGain = ctx.createGain(); seaGain.gain.value = .09;

    /* slow swell so the surf breathes instead of hissing flatly */
    const lfo = ctx.createOscillator(); lfo.frequency.value = .07;
    const lfoAmt = ctx.createGain(); lfoAmt.gain.value = .045;
    lfo.connect(lfoAmt); lfoAmt.connect(seaGain.gain); lfo.start();

    const wind = ctx.createBiquadFilter();
    wind.type = "bandpass"; wind.frequency.value = 1250; wind.Q.value = .8;
    const windGain = ctx.createGain(); windGain.gain.value = .022;
    const lfo2 = ctx.createOscillator(); lfo2.frequency.value = .043;
    const lfo2Amt = ctx.createGain(); lfo2Amt.gain.value = .016;
    lfo2.connect(lfo2Amt); lfo2Amt.connect(windGain.gain); lfo2.start();

    src.connect(sea); sea.connect(seaGain); seaGain.connect(this.master);
    src.connect(wind); wind.connect(windGain); windGain.connect(this.master);
    src.start();
    this.ambience = { seaGain, windGain };
  },

  /* --- voices ----------------------------------------------- */
  env(node, t, a, d, peak) {
    const g = node.gain;
    g.setValueAtTime(1e-4, t);
    g.exponentialRampToValueAtTime(Math.max(1e-4, peak), t + a);
    g.exponentialRampToValueAtTime(1e-4, t + a + d);
  },
  mtof: m => 440 * Math.pow(2, (m - 69) / 12),

  /* soft sustained chord voice */
  pad(notes, t, dur, wave = "sawtooth", cut = 900) {
    const ctx = this.ctx;
    const filt = ctx.createBiquadFilter();
    filt.type = "lowpass"; filt.frequency.value = cut; filt.Q.value = .8;
    const g = ctx.createGain(); g.gain.value = 0;
    filt.connect(g); g.connect(this.musicBus);
    const send = ctx.createGain(); send.gain.value = .3;
    g.connect(send); send.connect(this.revSend);

    for (const n of notes) for (const det of [-6, 6]) {
      const o = ctx.createOscillator();
      o.type = wave;
      o.frequency.value = this.mtof(n);
      o.detune.value = det;
      o.connect(filt);
      o.start(t); o.stop(t + dur + .6);
    }
    g.gain.setValueAtTime(1e-4, t);
    g.gain.linearRampToValueAtTime(.055, t + dur * .35);
    g.gain.linearRampToValueAtTime(1e-4, t + dur + .5);
  },

  pluck(note, t, dur = .5, wave = "triangle", vol = .1) {
    const ctx = this.ctx;
    const o = ctx.createOscillator(); o.type = wave;
    o.frequency.value = this.mtof(note);
    const f = ctx.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.setValueAtTime(4200, t);
    f.frequency.exponentialRampToValueAtTime(700, t + dur);
    const g = ctx.createGain();
    o.connect(f); f.connect(g); g.connect(this.musicBus);
    const send = ctx.createGain(); send.gain.value = .35;
    g.connect(send); send.connect(this.revSend);
    this.env(g, t, .008, dur, vol);
    o.start(t); o.stop(t + dur + .1);
  },

  bass(note, t, dur = .7) {
    const ctx = this.ctx;
    const o = ctx.createOscillator(); o.type = "sine";
    o.frequency.value = this.mtof(note);
    const g = ctx.createGain();
    o.connect(g); g.connect(this.musicBus);
    this.env(g, t, .02, dur, .16);
    o.start(t); o.stop(t + dur + .1);
  },

  tick(t, vol = .03) {
    const ctx = this.ctx;
    const s = ctx.createBufferSource(); s.buffer = this.noiseBuf;
    s.playbackRate.value = 2.4;
    const f = ctx.createBiquadFilter();
    f.type = "highpass"; f.frequency.value = 5200;
    const g = ctx.createGain();
    s.connect(f); f.connect(g); g.connect(this.musicBus);
    this.env(g, t, .003, .05, vol);
    s.start(t); s.stop(t + .09);
  },

  /* --- musical palettes, one per temple --------------------- */
  PALETTE: {
    default:  { root: 0,  wave: "triangle", cut: 1000, arp: [0, 3, 7, 10], density: .55, tickVol: .022 },
    about:    { root: 0,  wave: "triangle", cut: 1100, arp: [0, 4, 7, 9],  density: .5,  tickVol: .018 },
    tfg:      { root: 2,  wave: "sine",     cut: 1500, arp: [0, 3, 7, 12], density: .75, tickVol: .02 },
    triniglass:{ root: -2, wave: "sawtooth", cut: 780,  arp: [0, 5, 7, 10], density: .8,  tickVol: .05 },
    mastermind:{ root: 1,  wave: "sine",     cut: 1700, arp: [0, 3, 6, 10], density: .45, tickVol: .014 },
    gamedev:  { root: 4,  wave: "square",   cut: 2200, arp: [0, 4, 7, 12], density: .95, tickVol: .04 },
    skills:   { root: -5, wave: "sawtooth", cut: 620,  arp: [0, 3, 5, 7],  density: .7,  tickVol: .045 },
    path:     { root: 3,  wave: "triangle", cut: 1300, arp: [0, 4, 9, 12], density: .6,  tickVol: .025 },
    contact:  { root: -3, wave: "sine",     cut: 900,  arp: [0, 7, 12, 16], density: .35, tickVol: .012 }
  },
  CHORDS: [
    { pad: [57, 60, 64], bass: 45 },   // Am
    { pad: [53, 57, 60], bass: 41 },   // F
    { pad: [52, 55, 60], bass: 40 },   // C/E
    { pad: [55, 59, 62], bass: 43 }    // G
  ],

  setZone(key) { this.zoneGoal = key || "default"; },

  /* --- sequencer -------------------------------------------- */
  startMusic() {
    if (!this.ctx || this.timer) return;
    this.nextTime = this.ctx.currentTime + .12;
    this.step = 0; this.bar = 0;
    this.timer = setInterval(() => this.schedule(), 28);
  },
  schedule() {
    const ctx = this.ctx;
    if (!ctx || ctx.state !== "running") return;
    const stepDur = 60 / 76 / 4;                 // 16ths at 76bpm
    while (this.nextTime < ctx.currentTime + .18) {
      this.play(this.step, this.nextTime, stepDur);
      this.nextTime += stepDur;
      this.step++;
      if (this.step % 16 === 0) {
        this.bar++;
        this.zone = this.zoneGoal;               // switch palette on the bar
      }
    }
  },
  play(step, t, stepDur) {
    const p = this.PALETTE[this.zone] || this.PALETTE.default;
    const s = step % 16;
    const chord = this.CHORDS[this.bar % this.CHORDS.length];

    if (s === 0) {
      this.pad(chord.pad.map(n => n + p.root), t, stepDur * 15, "sawtooth", p.cut);
      this.bass(chord.bass + p.root, t, stepDur * 6);
    }
    if (s === 8) this.bass(chord.bass + p.root + 12, t, stepDur * 3);

    /* arpeggio rides on the current chord, thinned by the palette density */
    if (s % 2 === 0 && Math.random() < p.density) {
      const deg = p.arp[(s / 2) % p.arp.length];
      const oct = (s >= 8 ? 12 : 0);
      this.pluck(chord.bass + 24 + p.root + deg + oct, t, .55, p.wave, .085);
    }
    if (p.tickVol > .001 && (s === 4 || s === 12)) this.tick(t, p.tickVol);
    if (s === 14 && this.bar % 4 === 3)
      this.pluck(chord.pad[2] + p.root + 12, t, 1.4, "sine", .07);
  },

  /* --- lifecycle -------------------------------------------- */
  begin() {
    const ctx = this.init();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();
    if (!this.started) { this.started = true; this.startMusic(); }
  },
  setOn(v) {
    this.on = v;
    try { localStorage.setItem("rja_audio", v ? "1" : "0"); } catch { }
    if (!this.master) return;
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setTargetAtTime(v ? .9 : 0, t, .08);
  },
  /* pull the music down while an overlay is open so text reads quietly */
  duck(v) {
    if (!this.musicBus) return;
    this.musicBus.gain.setTargetAtTime(v ? .12 : .34, this.ctx.currentTime, .12);
  },

  /* --- effects ---------------------------------------------- */
  blip(freq, dur = .09, type = "square", vol = .07, slideTo = null) {
    if (!this.ctx || !this.on) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    const g = ctx.createGain();
    o.connect(g); g.connect(this.sfxBus);
    this.env(g, t, .006, dur, vol);
    o.start(t); o.stop(t + dur + .05);
  },

  step_(fast) {
    if (!this.ctx || !this.on) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = this.noiseBuf;
    s.playbackRate.value = 1.4 + Math.random() * .5;
    const f = ctx.createBiquadFilter();
    f.type = "bandpass";
    f.frequency.value = 520 + Math.random() * 380;
    f.Q.value = 1.4;
    const g = ctx.createGain();
    s.connect(f); f.connect(g); g.connect(this.sfxBus);
    this.env(g, t, .004, fast ? .05 : .075, fast ? .05 : .035);
    s.start(t); s.stop(t + .14);
  },

  jump(dbl) {
    if (!this.ctx || !this.on) return;
    this.blip(dbl ? 560 : 380, .14, "sine", .09, dbl ? 1150 : 760);
    if (dbl) [1200, 1500, 1800].forEach((f, i) =>
      setTimeout(() => this.blip(f, .06, "triangle", .05), 40 + i * 45));
  },

  land(hard) {
    if (!this.ctx || !this.on) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(210, t);
    o.frequency.exponentialRampToValueAtTime(58, t + .16);
    const g = ctx.createGain();
    o.connect(g); g.connect(this.sfxBus);
    this.env(g, t, .005, .17, hard ? .16 : .07);
    o.start(t); o.stop(t + .24);
    const s = ctx.createBufferSource(); s.buffer = this.noiseBuf;
    s.playbackRate.value = .8;
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
    const ng = ctx.createGain();
    s.connect(f); f.connect(ng); ng.connect(this.sfxBus);
    this.env(ng, t, .004, .12, hard ? .09 : .04);
    s.start(t); s.stop(t + .2);
  },

  /* rising run that climbs a little with every fish collected */
  pickup(n) {
    if (!this.ctx || !this.on) return;
    const base = 72 + Math.min(11, n);
    [0, 4, 7].forEach((d, i) => setTimeout(() =>
      this.blip(this.mtof(base + d), .13, "triangle", .09), i * 62));
  },

  chime() {
    if (!this.ctx || !this.on) return;
    const ctx = this.ctx, t0 = ctx.currentTime;
    [64, 68, 71, 76].forEach((n, i) => {
      const t = t0 + i * .1;
      const o = ctx.createOscillator(); o.type = "sine";
      o.frequency.value = this.mtof(n);
      const g = ctx.createGain();
      o.connect(g); g.connect(this.sfxBus);
      const send = ctx.createGain(); send.gain.value = .6;
      g.connect(send); send.connect(this.revSend);
      this.env(g, t, .01, 1.1, .1);
      o.start(t); o.stop(t + 1.3);
    });
  },

  fanfare() {
    if (!this.ctx || !this.on) return;
    [72, 76, 79, 84, 88].forEach((n, i) => setTimeout(() =>
      this.blip(this.mtof(n), .3, "triangle", .1), i * 110));
  },

  deny() {
    if (!this.ctx || !this.on) return;
    this.blip(200, .12, "square", .06);
    setTimeout(() => this.blip(150, .18, "square", .06), 110);
  },

  ui(open) {
    this.blip(open ? 760 : 520, .06, "sine", .05, open ? 980 : 400);
  },

  /* two band-passed formants over a saw give a much more cat-like meow
     than the single filtered oscillator this used to be */
  meow() {
    const ctx = this.init();
    if (!ctx || !this.on) { toast(TXT().toastHonk); return; }
    if (ctx.state === "suspended") ctx.resume();
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(300, t);
    o.frequency.linearRampToValueAtTime(560, t + .13);
    o.frequency.linearRampToValueAtTime(430, t + .34);
    o.frequency.linearRampToValueAtTime(300, t + .52);

    const vib = ctx.createOscillator(); vib.frequency.value = 22;
    const vibAmt = ctx.createGain(); vibAmt.gain.value = 11;
    vib.connect(vibAmt); vibAmt.connect(o.frequency); vib.start(t); vib.stop(t + .6);

    const out = ctx.createGain();
    this.env(out, t, .05, .5, .18);
    out.connect(this.sfxBus);
    const send = ctx.createGain(); send.gain.value = .25;
    out.connect(send); send.connect(this.revSend);

    /* vowel formants sweeping from "ee" to "ow" */
    [[900, 1700], [1300, 900]].forEach(([f0, f1], i) => {
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass"; bp.Q.value = 7;
      bp.frequency.setValueAtTime(f0, t);
      bp.frequency.linearRampToValueAtTime(f1, t + .5);
      const g = ctx.createGain(); g.gain.value = i ? .5 : 1;
      o.connect(bp); bp.connect(g); g.connect(out);
    });
    o.start(t); o.stop(t + .58);
    toast(TXT().toastHonk);
  }
};

try { Snd.on = localStorage.getItem("rja_audio") !== "0"; } catch { }

function refreshAudioBtn() {
  const b = $("#audioBtn");
  if (b) { b.textContent = Snd.on ? "♪" : "🔇"; b.style.color = Snd.on ? "" : "var(--faint)"; }
}
$("#audioBtn").addEventListener("click", () => {
  Snd.begin();
  Snd.setOn(!Snd.on);
  refreshAudioBtn();
});
refreshAudioBtn();


/* ============================================================
   MINIGAME — Mastermind, playable inside the Ruins of the Riddle.
   Raúl shipped a Mastermind implementation, so the temple that
   represents it now actually plays it: crack the four-colour code
   the altar has been shuffling, and the orbs lock to your answer.
   Every colour carries a glyph as well as a hue so the board is
   readable without relying on colour alone.
   ============================================================ */
const MM_COLORS = [
  { hex: "#7fdca8", int: 0x7fdca8, glyph: "●", key: "1" },
  { hex: "#e8b06a", int: 0xe8b06a, glyph: "▲", key: "2" },
  { hex: "#f2a2c4", int: 0xf2a2c4, glyph: "◆", key: "3" },
  { hex: "#8fb0ff", int: 0x8fb0ff, glyph: "■", key: "4" },
  { hex: "#f07a6a", int: 0xf07a6a, glyph: "★", key: "5" },
  { hex: "#ffd76a", int: 0xffd76a, glyph: "✚", key: "6" }
];
const MM_LEN = 4, MM_TRIES = 10;

const MM_TXT = {
  es: {
    kicker: "Ruinas del Enigma · minijuego",
    title: "El código ancestral",
    hint: `Cuatro orbes guardan un código de ${MM_LEN} colores (pueden repetirse). Tienes ${MM_TRIES} intentos. Tras cada intento: <b style="color:#7fdca8">●</b> acierto en su sitio, <b>○</b> color correcto en otra posición.`,
    check: "Comprobar", clear: "Borrar", close: "Salir",
    left: n => `${n} intento${n === 1 ? "" : "s"}`,
    winT: "🏛 Código descifrado",
    winB: n => `Lo has roto en ${n} intento${n === 1 ? "" : "s"}. Los orbes del altar se han fijado a tu solución — el enigma es tuyo.`,
    loseT: "El enigma resiste",
    loseB: "Se acabaron los intentos. Este era el código. Pulsa Reintentar para otra ronda.",
    retry: "Reintentar",
    toastOpen: "Descifra el código de los orbes",
    needZone: "Acércate a las Ruinas del Enigma para jugar"
  },
  en: {
    kicker: "Ruins of the Riddle · minigame",
    title: "The ancient code",
    hint: `Four orbs guard a ${MM_LEN}-colour code (repeats allowed). You get ${MM_TRIES} tries. After each guess: <b style="color:#7fdca8">●</b> right colour in the right place, <b>○</b> right colour, wrong place.`,
    check: "Check", clear: "Clear", close: "Leave",
    left: n => `${n} tr${n === 1 ? "y" : "ies"} left`,
    winT: "🏛 Code cracked",
    winB: n => `Broken in ${n} guess${n === 1 ? "" : "es"}. The altar orbs have locked to your answer — the riddle is yours.`,
    loseT: "The riddle holds",
    loseB: "Out of tries. That was the code. Hit Retry for another round.",
    retry: "Retry",
    toastOpen: "Crack the orb code",
    needZone: "Get to the Ruins of the Riddle to play"
  }
};
const MT = () => MM_TXT[state.lang];

const MM = { code: [], guesses: [], cur: [], over: false, won: false };

function mmNewGame() {
  MM.code = Array.from({ length: MM_LEN }, () => Math.floor(Math.random() * MM_COLORS.length));
  MM.guesses = []; MM.cur = []; MM.over = false; MM.won = false;
}

/* classic scoring: exact matches first, then colours that exist elsewhere */
function mmScore(guess, code) {
  const used = new Array(MM_LEN).fill(false);
  const taken = new Array(MM_LEN).fill(false);
  let hit = 0, near = 0;
  for (let i = 0; i < MM_LEN; i++)
    if (guess[i] === code[i]) { hit++; used[i] = true; taken[i] = true; }
  for (let i = 0; i < MM_LEN; i++) {
    if (used[i]) continue;
    for (let j = 0; j < MM_LEN; j++) {
      if (taken[j] || guess[i] !== code[j]) continue;
      taken[j] = true; near++; break;
    }
  }
  return { hit, near };
}

function mmSlot(ci, extra = "") {
  if (ci == null) return `<div class="slot empty${extra}">·</div>`;
  const c = MM_COLORS[ci];
  return `<div class="slot${extra}" style="background:${c.hex}">${c.glyph}</div>`;
}

function mmRender() {
  const t = MT();
  const rows = [];
  MM.guesses.forEach((g, i) => {
    const pegs = [];
    for (let k = 0; k < MM_LEN; k++)
      pegs.push(`<div class="peg ${k < g.hit ? "hit" : k < g.hit + g.near ? "near" : ""}"></div>`);
    rows.push(`<div class="row"><span class="n">${i + 1}</span>
      <div class="slots">${g.guess.map(c => mmSlot(c)).join("")}</div>
      <div class="pegs">${pegs.join("")}</div></div>`);
  });
  if (!MM.over) {
    const slots = [];
    for (let i = 0; i < MM_LEN; i++) slots.push(mmSlot(MM.cur[i] ?? null));
    rows.push(`<div class="row live"><span class="n">${MM.guesses.length + 1}</span>
      <div class="slots" id="mmLive">${slots.join("")}</div>
      <div class="pegs"></div></div>`);
  }
  $("#mmRows").innerHTML = rows.join("");

  /* clicking a filled slot in the active row clears it again */
  const live = $("#mmLive");
  if (live) Array.from(live.children).forEach((el, i) => {
    el.style.cursor = "pointer";
    el.addEventListener("click", () => {
      if (MM.cur[i] == null) return;
      MM.cur.splice(i, 1);
      Snd.blip(320, .05, "sine", .05);
      mmRender();
    });
  });

  $("#mmPalette").innerHTML = MM_COLORS.map((c, i) =>
    `<button class="pick" data-i="${i}" style="background:${c.hex}"
       aria-label="${c.glyph}">${c.glyph}<i>${c.key}</i></button>`).join("");
  $$("#mmPalette .pick").forEach(b =>
    b.addEventListener("click", () => mmPick(+b.dataset.i)));

  $("#mmCheck").textContent = t.check;
  $("#mmClear").textContent = t.clear;
  $("#mmClose").textContent = t.close;
  $("#mmCheck").disabled = MM.over || MM.cur.length < MM_LEN;
  $("#mmClear").style.display = MM.over ? "none" : "";
  $("#mmCheck").style.display = MM.over ? "none" : "";
  $("#mmStatus").textContent = MM.over ? "" : t.left(MM_TRIES - MM.guesses.length);

  const done = $("#mmDone");
  if (MM.over) {
    done.classList.add("show");
    $("#mmDoneT").textContent = MM.won ? t.winT : t.loseT;
    $("#mmDoneT").style.color = MM.won ? "var(--green)" : "var(--amber)";
    $("#mmDoneB").innerHTML = MM.won
      ? t.winB(MM.guesses.length)
      : `${t.loseB}<div class="slots" style="margin-top:12px">${MM.code.map(c => mmSlot(c)).join("")}</div>`;
    if (!$("#mmRetry")) {
      const b = document.createElement("button");
      b.id = "mmRetry"; b.className = "btn primary"; b.style.marginTop = "14px";
      b.addEventListener("click", () => { mmNewGame(); Snd.ui(true); mmRender(); });
      done.appendChild(b);
    }
    $("#mmRetry").textContent = t.retry;
    $("#mmRetry").style.display = MM.won ? "none" : "";
    requestAnimationFrame(() => done.scrollIntoView({ block: "nearest" }));
  } else {
    done.classList.remove("show");
  }
}

function mmPick(i) {
  if (MM.over || MM.cur.length >= MM_LEN) return;
  MM.cur.push(i);
  Snd.blip(Snd.mtof(67 + i * 2), .08, "triangle", .07);
  mmRender();
}

function mmCheckGuess() {
  if (MM.over || MM.cur.length < MM_LEN) return;
  const guess = MM.cur.slice();
  const { hit, near } = mmScore(guess, MM.code);
  MM.guesses.push({ guess, hit, near });
  MM.cur = [];
  if (hit === MM_LEN) {
    MM.over = true; MM.won = true;
    state.mmSolved = true;
    Snd.fanfare();
    if (game) {
      game.lockRuneOrbs(MM.code.map(i => MM_COLORS[i].int));
      const p = ZONE_POS[3];
      game.confetti(p.x, 5, p.z, 70);
    }
    toast(MT().winT, 3200);
  } else if (MM.guesses.length >= MM_TRIES) {
    MM.over = true; MM.won = false;
    Snd.deny();
  } else {
    Snd.blip(hit ? 620 + hit * 90 : 300, .12, "sine", .07);
  }
  mmRender();
}

function mmOpen() {
  Snd.begin();
  if (!MM.code.length || MM.over && MM.won) mmNewGame();
  state.minigame = true;
  const t = MT();
  $("#mmKicker").textContent = t.kicker;
  $("#mmTitle").textContent = t.title;
  $("#mmHint").innerHTML = t.hint;
  mmRender();
  $("#mm").classList.add("show");
  Snd.duck(true);
  Snd.ui(true);
}
function mmClose() {
  state.minigame = false;
  $("#mm").classList.remove("show");
  Snd.duck(!!(state.activeProject != null || state.infoSection));
  Snd.ui(false);
}

$("#mmCheck").addEventListener("click", mmCheckGuess);
$("#mmClear").addEventListener("click", () => { MM.cur = []; Snd.blip(300, .06, "sine", .05); mmRender(); });
$("#mmClose").addEventListener("click", mmClose);
$("#mm").addEventListener("click", e => { if (e.target.id === "mm") mmClose(); });
$("#mPlay").addEventListener("click", () => { closeProject(); mmOpen(); });

/* keyboard: 1-6 pick a colour, Backspace undoes, Enter checks */
addEventListener("keydown", e => {
  if (!state.minigame) return;
  const k = e.key;
  if (k === "Escape") { mmClose(); return; }
  if (k === "Enter") { mmCheckGuess(); return; }
  if (k === "Backspace") {
    e.preventDefault();
    if (!MM.over && MM.cur.length) { MM.cur.pop(); Snd.blip(320, .05, "sine", .05); mmRender(); }
    return;
  }
  const n = MM_COLORS.findIndex(c => c.key === k);
  if (n >= 0) mmPick(n);
});

/* G opens the game from inside the ruins */
function tryOpenMinigame() {
  if (state.minigame) return;
  if (state.near && state.near.meta.key === "mastermind") mmOpen();
  else toast(MT().needZone, 1800);
}


/* ============================================================
   GAME — world, physics, island
   ============================================================ */
let game = null;

/* temple positions on the island (index-aligned with ZONES_META) */
const ZONE_POS = [
  { x: -42, z: 34, r: 9 },     // 0 casa del gato
  { x: 56, z: -2, r: 11 },     // 1 templo de la evolución
  { x: 38, z: -48, r: 11 },    // 2 gran almacén
  { x: -56, z: -26, r: 11 },   // 3 ruinas del enigma
  { x: 2, z: 60, r: 11 },      // 4 santuario arcade
  { x: -16, z: -60, r: 10 },   // 5 forja de skills
  { x: 58, z: 40, r: 13 },     // 6 colina del tiempo
  { x: -70, z: 10, r: 11 }     // 7 faro de señales
];

/* ============================================================
   TERRAIN — the island used to be a flat disc; it is now a real
   heightmap. Everything the player walks on (plaza, temples,
   paths) is carved back down to y=0 so the buildings and their
   colliders keep working unchanged, and the relief happens in
   between: rolling hills, dunes and an irregular coastline.

   cannon-es shipped here has no Heightfield shape (tree-shaken
   out), so the flat y=0 plane stays as the physics floor and the
   cat is lifted onto the hills analytically in the game loop.
   Nothing dynamic ever leaves the flat areas, so that is enough.
   ============================================================ */
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const smoothstep = (a, b, x) => {
  const t = clamp01((x - a) / (b - a));
  return t * t * (3 - 2 * t);
};

/* deterministic value noise — heightAt() is queried from several
   places and must give the same answer every time */
function hash2(i, j) {
  let n = (Math.imul(i | 0, 374761393) + Math.imul(j | 0, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y) {
  const i = Math.floor(x), j = Math.floor(y);
  const fx = x - i, fy = y - j;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return hash2(i, j) * (1 - u) * (1 - v) + hash2(i + 1, j) * u * (1 - v)
       + hash2(i, j + 1) * (1 - u) * v + hash2(i + 1, j + 1) * u * v;
}
function fbm(x, y, oct = 4) {
  let sum = 0, amp = .5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { sum += vnoise(x * f, y * f) * amp; norm += amp; f *= 2; amp *= .5; }
  return sum / norm;
}

/* areas that must stay dead flat: plaza, playground, pond, every
   temple, and a corridor along each path out of the plaza */
const FLAT_DISCS = [
  { x: 0, z: 0, r: 19, fade: 9 },       // plaza + fountain
  { x: 15, z: 5, r: 15, fade: 7 },      // physics playground
  { x: -13, z: -11, r: 9, fade: 8 },    // crate pyramid
  { x: -20, z: 12, r: 10, fade: 7 },    // pond
  { x: 0, z: -17, r: 9, fade: 7 },      // RAUL letters
  { x: -8, z: 20, r: 7, fade: 6 },      // seesaw
  { x: 24, z: -2, r: 8, fade: 6 },      // ramp
  { x: -26, z: 2, r: 8, fade: 6 },      // ramp
  ...ZONE_POS.map(p => ({ x: p.x, z: p.z, r: p.r + 3, fade: 8 }))
];
const PATH_LINES = ZONE_POS.map(p => ({ x1: 0, z1: 0, x2: p.x, z2: p.z }));

function distToSegment(x, z, s) {
  const dx = s.x2 - s.x1, dz = s.z2 - s.z1;
  const len2 = dx * dx + dz * dz || 1;
  const t = clamp01(((x - s.x1) * dx + (z - s.z1) * dz) / len2);
  return Math.hypot(x - (s.x1 + dx * t), z - (s.z1 + dz * t));
}

/* 0 where the ground must be flat, 1 where the relief is free */
function flatMask(x, z) {
  let m = 1;
  for (const s of FLAT_DISCS) {
    m = Math.min(m, smoothstep(s.r, s.r + s.fade, Math.hypot(x - s.x, z - s.z)));
    if (m <= 0) return 0;
  }
  for (const l of PATH_LINES) {
    m = Math.min(m, smoothstep(3.6, 9, distToSegment(x, z, l)));
    if (m <= 0) return 0;
  }
  return m;
}

/* the coast is not a circle: bays and headlands come from a few
   sine terms so the silhouette reads as an island, not a coin */
const COAST_R = 92;
function coastRadius(ang) {
  return COAST_R
    + 15 * Math.sin(ang * 3 + .6)
    + 9 * Math.cos(ang * 5 - 1.1)
    + 6 * Math.sin(ang * 2 + 2.3);
}

/* Height of the ground at any point. Always >= 0 on land, so the
   flat physics plane never pokes through the terrain. */
function heightAt(x, z) {
  const d = Math.hypot(x, z);
  const R = coastRadius(Math.atan2(z, x));
  const t = d / R;

  /* hills fade out as the shore approaches, leaving flat sand */
  const inland = smoothstep(1.0, .74, t);
  let h = (fbm(x * .0115, z * .0115, 4) - .46) * 44;
  h += (fbm(x * .042 + 11, z * .042 - 7, 3) - .5) * 5;
  h = Math.max(0, h) * inland;

  /* one long ridge so the island has a spine instead of only bumps */
  h += Math.max(0, 1 - Math.abs(fbm(x * .0075 - 5, z * .0075 + 3, 2) - .52) * 7) * 11 * inland;

  h *= flatMask(x, z);
  /* everything past the shoreline dives under the sea */
  h -= Math.max(0, t - 1.015) * 260;
  return h;
}

class Game {
  constructor(host) {
    this.host = host;
    this.renderer = new GLRenderer({ antialias: !IS_TOUCH, powerPreference: "high-performance" });
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, IS_TOUCH ? 1.5 : 2));
    this.renderer.setSize(innerWidth, innerHeight);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = SHADOW_SOFT;
    this.renderer.outputColorSpace = SRGB;
    this.renderer.toneMapping = TONE_ACES;
    this.renderer.toneMappingExposure = 1.22;
    host.appendChild(this.renderer.domElement);

    this.scene = new Scene3();
    this.scene.background = this.skyTexture();
    this.scene.fog = new Fog3(0x2a3c58, 90, 430);

    this.camera = new PerspCam(60, innerWidth / innerHeight, .1, 2400);
    this.camGoal = new V3(); this.camLook = new V3();
    this.camYaw = 0; this.fovGoal = 60;

    this.useBloom = !IS_TOUCH && !REDUCED;
    this.composer = new Composer(this.renderer);
    this.composer.addPass(new RenderPass(this.scene, this.camera));
    this.bloom = new BloomPass(new V2(innerWidth, innerHeight), .42, .5, .82);
    this.composer.addPass(this.bloom);
    this.composer.addPass(new OutPass());

    /* ---------- lighting rig: golden-hour dusk ----------
       The sun disc sits low toward -Z, so the key light comes from there and
       the shadows agree with the sky gradient. A cool fill from the opposite
       side keeps shadowed faces readable, and a faint up-light stands in for
       light bouncing off the sea. Every small lamp/fire/crystal goes through
       the light pool below instead of being its own PointLight. */
    this.sunDir = new V3(90, 95, -160).normalize();

    this.scene.add(new HemiLight(0x7fa2dc, 0x3d4632, 1));

    const sun = new DirLight(0xffc490, 2.5);
    sun.castShadow = true;
    const SMAP = IS_TOUCH ? 1024 : 2048;
    sun.shadow.mapSize.set(SMAP, SMAP);
    this.shadowExtent = IS_TOUCH ? 40 : 58;
    Object.assign(sun.shadow.camera, {
      left: -this.shadowExtent, right: this.shadowExtent,
      top: this.shadowExtent, bottom: -this.shadowExtent, near: 1, far: 260
    });
    sun.shadow.camera.updateProjectionMatrix();
    sun.shadow.bias = -3e-4;
    sun.shadow.normalBias = .04;
    sun.shadow.radius = 2.2;
    this.scene.add(sun, sun.target);
    this.sun = sun;
    this.shadowTexel = (this.shadowExtent * 2) / SMAP;

    const fill = new DirLight(0x8fb4ff, .8);
    fill.position.set(-90, 55, 120);
    this.scene.add(fill);

    const seaBounce = new DirLight(0x3d5f8a, .3);
    seaBounce.position.set(10, -40, 30);
    this.scene.add(seaBounce);

    /* physics */
    this.world = new CWorld({ gravity: new CVec(0, -24, 0) });
    this.world.broadphase = new CSAP(this.world);
    this.world.defaultContactMaterial.friction = .35;
    this.world.defaultContactMaterial.restitution = .15;
    this.groundMat = new CMat("ground");
    this.bounceMat = new CMat("bounce");
    this.catMat = new CMat("cat");
    this.world.addContactMaterial(new CContact(this.groundMat, this.bounceMat, { friction: .2, restitution: .8 }));
    this.world.addContactMaterial(new CContact(this.groundMat, this.catMat, { friction: 0, restitution: 0 }));

    this.sync = [];          // dynamic mesh<->body pairs
    this.zones = [];         // interactive temple zones
    this.anims = [];         // fn(t, dt) called each frame
    this.fishes = [];        // collectibles
    this.lightSources = [];  // every lamp/fire/crystal, lit through the pool
    this.lightPool = [];
    this.labels = [];        // floating temple names, faded by distance
    this.clock = new Clock3();
    this.elapsed = 0;

    this.buildTerrain();
    this.buildPlaza();
    this.buildPlayground();
    this.buildNature();
    this.buildSky();
    this.buildTemples();
    this.buildFish();
    this.buildCat();
    this.initLightPool(IS_TOUCH ? 4 : 8);
    this._bind();
    this.loop = this.loop.bind(this);
  }

  /* ============ light pool ============
     The island has ~30 warm sources (lamps, fires, crystals, windows). Lighting
     them all at once would mean 30 point lights in every shader. Instead each
     one registers as a source here and a small fixed pool of real PointLights
     tracks whichever sources are nearest the camera, fading in and out so the
     hand-off is invisible. Fixed light count = no shader recompiles. */
  addLight(x, y, z, color, intensity, distance) {
    const src = { pos: new V3(x, y, z), color: new Col(color), intensity, distance, d: 0, want: false };
    this.lightSources.push(src);
    return src;
  }
  initLightPool(n) {
    for (let i = 0; i < n; i++) {
      const l = new PtLight(0xffffff, 0, 10, 2);
      l.k = 0; l.src = null;
      this.scene.add(l);
      this.lightPool.push(l);
    }
  }
  updateLights(dt) {
    const pool = this.lightPool, srcs = this.lightSources, cam = this.camera.position;
    for (const s of srcs) { s.d = s.pos.distanceTo(cam); s.want = false; }
    srcs.sort((a, b) => a.d - b.d);
    const n = Math.min(pool.length, srcs.length);
    for (let i = 0; i < n; i++) srcs[i].want = true;

    /* free any slot whose source dropped out and has finished fading */
    const free = [];
    for (const l of pool) {
      if (!l.src) { free.push(l); continue; }
      if (!l.src.want && l.k <= 0) { l.src = null; free.push(l); }
    }
    for (let i = 0; i < n && free.length; i++) {
      const s = srcs[i];
      if (pool.some(l => l.src === s)) continue;
      const l = free.pop();
      l.src = s; l.k = 0;
    }
    const step = dt * 3.5;
    for (const l of pool) {
      if (!l.src) { l.intensity = 0; continue; }
      l.k = l.src.want ? Math.min(1, l.k + step) : Math.max(0, l.k - step);
      l.position.copy(l.src.pos);
      l.color.copy(l.src.color);
      l.distance = l.src.distance;
      l.intensity = l.src.intensity * l.k;
    }
  }

  /* ============ small helpers ============ */
  mat(c, o = {}) { return new StdMat(Object.assign({ color: c, roughness: .85, metalness: .05 }, o)); }
  bmat(c, o = {}) { return new BasicMat(Object.assign({ color: c }, o)); }

  m(geo, material, x = 0, y = 0, z = 0, o = {}) {
    const mesh = new Mesh(geo, material);
    mesh.position.set(x, y, z);
    if (o.rx) mesh.rotation.x = o.rx;
    if (o.ry) mesh.rotation.y = o.ry;
    if (o.rz) mesh.rotation.z = o.rz;
    mesh.castShadow = o.cast !== false;
    mesh.receiveShadow = !!o.recv;
    (o.parent || this.scene).add(mesh);
    return mesh;
  }

  /* invisible static box collider */
  sbox(sx, sy, sz, x, y, z, ry = 0) {
    const body = new CBody({ mass: 0, material: this.groundMat });
    body.addShape(new CBox(new CVec(sx / 2, sy / 2, sz / 2)));
    body.position.set(x, y, z);
    if (ry) body.quaternion.setFromEuler(0, ry, 0);
    this.world.addBody(body);
    return body;
  }
  scyl(r, h, x, y, z) {
    const body = new CBody({ mass: 0, material: this.groundMat });
    body.addShape(new CCyl(r, r, h, 10));
    body.position.set(x, y, z);
    this.world.addBody(body);
    return body;
  }

  /* dynamic physics box with mesh */
  dbox(sx, sy, sz, x, y, z, color, mass, o = {}) {
    const mesh = this.m(new BoxGeo(sx, sy, sz), this.mat(color, o.matOpts || { roughness: .9, flatShading: true }), x, y, z, { recv: true });
    const body = new CBody({ mass, material: o.phys || null });
    body.addShape(new CBox(new CVec(sx / 2, sy / 2, sz / 2)));
    body.position.set(x, y, z);
    if (o.ry) { body.quaternion.setFromEuler(0, o.ry, 0); mesh.quaternion.copy(body.quaternion); }
    this.world.addBody(body);
    this.sync.push({ mesh, body });
    return { mesh, body };
  }
  dsphere(r, x, y, z, color, mass, o = {}) {
    const mesh = this.m(new SphGeo(r, 18, 14), this.mat(color, o.matOpts || { roughness: .4 }), x, y, z);
    const body = new CBody({ mass, material: o.phys || this.bounceMat });
    body.addShape(new CSph(r));
    body.position.set(x, y, z);
    this.world.addBody(body);
    this.sync.push({ mesh, body });
    return { mesh, body };
  }

  /* canvas helpers */
  makeCanvas(w, h, draw) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);
    const tex = new CanvasTex(c);
    tex.colorSpace = SRGB;
    return tex;
  }
  noiseTexture(base, spots, n = 260, repeat = 26) {
    const tex = this.makeCanvas(256, 256, (g) => {
      g.fillStyle = base; g.fillRect(0, 0, 256, 256);
      for (let i = 0; i < n; i++) {
        g.fillStyle = spots[i % spots.length];
        const s = 2 + Math.random() * 7;
        g.beginPath();
        g.arc(Math.random() * 256, Math.random() * 256, s, 0, 7);
        g.fill();
      }
    });
    tex.wrapS = tex.wrapT = WRAP_REPEAT;
    tex.repeat.set(repeat, repeat);
    return tex;
  }

  /* Floating text label. The canvas is sized to the measured text instead of a
     fixed 512px, so long names ("Templo de la Evolución") never get clipped;
     `height` is the world height of the plate, and the width follows from the
     text, which keeps glyphs the same size on every label. */
  makeLabel(text, color, height = 2.4) {
    const FONT = 64, PADX = 34, PADY = 22;
    const font = `700 ${FONT}px "JetBrains Mono", monospace`;
    const probe = document.createElement("canvas").getContext("2d");
    probe.font = font;
    const mt = probe.measureText(text);
    /* actualBoundingBox covers glyph overhang that `width` alone misses */
    const tw = Math.ceil(Math.max(mt.width, (mt.actualBoundingBoxLeft || 0) + (mt.actualBoundingBoxRight || 0)) * 1.04);
    const w = tw + PADX * 2, h = FONT + PADY * 2;

    const plate = (g, x, y, ww, hh, r) => {
      g.beginPath();
      g.moveTo(x + r, y);
      g.lineTo(x + ww - r, y); g.quadraticCurveTo(x + ww, y, x + ww, y + r);
      g.lineTo(x + ww, y + hh - r); g.quadraticCurveTo(x + ww, y + hh, x + ww - r, y + hh);
      g.lineTo(x + r, y + hh); g.quadraticCurveTo(x, y + hh, x, y + hh - r);
      g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
      g.closePath();
    };

    const tex = this.makeCanvas(w, h, g => {
      plate(g, 3, 3, w - 6, h - 6, 18);
      g.fillStyle = "rgba(10,12,16,0.62)";
      g.fill();
      g.strokeStyle = color; g.globalAlpha = .5; g.lineWidth = 3;
      g.stroke();
      g.globalAlpha = 1;
      g.font = font;
      g.textAlign = "center"; g.textBaseline = "middle";
      g.shadowColor = color; g.shadowBlur = 22;
      g.fillStyle = color;
      g.fillText(text, w / 2, h / 2 + 2);
      g.shadowBlur = 0;
      g.fillText(text, w / 2, h / 2 + 2);
    });
    tex.anisotropy = 8;
    const sp = new Sprite3(new SpriteMat({ map: tex, transparent: true, depthWrite: false }));
    sp.scale.set(height * w / h, height, 1);
    return sp;
  }

  radialTexture() {
    if (this._radial) return this._radial;
    this._radial = this.makeCanvas(128, 128, g => {
      const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      grad.addColorStop(0, "rgba(255,255,255,1)");
      grad.addColorStop(.45, "rgba(255,255,255,0.35)");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
    });
    return this._radial;
  }
  glowSprite(color, size, pos) {
    const s = new Sprite3(new SpriteMat({ map: this.radialTexture(), color, transparent: true, depthWrite: false, blending: BLEND_ADD }));
    s.scale.set(size, size, 1);
    s.position.copy(pos);
    return s;
  }

  /* wooden sign with engraved name */
  sign(x, z, ry, text, color) {
    const g = new Grp(); g.position.set(x, 0, z); g.rotation.y = ry;
    const wood = this.mat(0x4a3628, { roughness: .95 });
    this.m(new CylGeo(.12, .16, 2.1, 6), wood, -.55, 1.05, 0, { parent: g });
    this.m(new CylGeo(.12, .16, 2.1, 6), wood, .55, 1.05, 0, { parent: g });
    const board = this.m(new BoxGeo(2.3, 1, .12), this.mat(0x5d4433, { roughness: .9 }), 0, 1.75, 0, { parent: g });
    /* Board text is wrapped to the widest line that fits, then the font is
       shrunk until even that line clears the frame — long temple names used to
       run off the plank. */
    const tex = this.makeCanvas(256, 112, ctx => {
      ctx.fillStyle = "#5d4433"; ctx.fillRect(0, 0, 256, 112);
      ctx.strokeStyle = "#3c2b1e"; ctx.lineWidth = 6; ctx.strokeRect(6, 6, 244, 100);
      const MAXW = 214;
      const words = text.split(" ");
      let lines = [text];
      if (words.length > 1) {
        const mid = Math.ceil(words.length / 2);
        lines = [words.slice(0, mid).join(" "), words.slice(mid).join(" ")];
      }
      let size = 30;
      const widest = () => {
        ctx.font = `700 ${size}px "JetBrains Mono", monospace`;
        return Math.max(...lines.map(l => ctx.measureText(l).width));
      };
      while (widest() > MAXW && size > 12) size -= 1;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = color;
      const step = size + 6;
      lines.forEach((l, i) => ctx.fillText(l, 128, 56 + (i - (lines.length - 1) / 2) * step));
    });
    board.material = new StdMat({ map: tex, roughness: .9 });
    this.scene.add(g);
    return g;
  }

  skyTexture() {
    const c = document.createElement("canvas");
    c.width = 8; c.height = 256;
    const g = c.getContext("2d");
    const grad = g.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, "#0a1430");
    grad.addColorStop(.45, "#1b3358");
    grad.addColorStop(.72, "#4a5a78");
    grad.addColorStop(.9, "#b08258");
    grad.addColorStop(1, "#e0a468");
    g.fillStyle = grad; g.fillRect(0, 0, 8, 256);
    const tex = new CanvasTex(c);
    tex.colorSpace = SRGB;
    tex.mapping = MAP_EQUIRECT;
    return tex;
  }

  /* ============ terrain: island, water, paths ============ */
  buildTerrain() {
    /* Flat physics floor. Every built area is carved to y=0, and the cat is
       pushed up onto the hills analytically in the loop, so a plane is enough. */
    const ground = new CBody({ mass: 0, material: this.groundMat });
    ground.addShape(new CPlane());
    ground.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    this.world.addBody(ground);

    /* ---- sea ---- */
    const water = this.m(new CircleGeo(900, 96),
      this.mat(0x17405f, { roughness: .34, metalness: .18 }), 0, -.85, 0,
      { rx: -Math.PI / 2, cast: false, recv: true });
    this.water = water;

    /* laid flat rather than a sprite, so the reflection stays on the sea
       instead of swinging around with the camera */
    const sunLane = new Grp();
    sunLane.rotation.y = Math.atan2(this.sunDir.x, this.sunDir.z);
    this.scene.add(sunLane);
    const lane = this.m(new PlaneGeo(52, 240),
      new BasicMat({ map: this.radialTexture(), color: 0xffb877, transparent: true,
                     opacity: .3, depthWrite: false, blending: BLEND_ADD }),
      0, -.7, 132, { rx: -Math.PI / 2, cast: false, parent: sunLane });
    this.anims.push(t => { lane.material.opacity = .26 + Math.sin(t * .8) * .05; });

    /* ---- island mesh ----
       A subdivided plane displaced by heightAt(), tinted per vertex so sand,
       grass, rock and the odd snowy top come from the shape itself instead of
       a texture that would stretch over the slopes. */
    const SEG = IS_TOUCH ? 110 : 200, SIZE = 300;
    const geo = new PlaneGeo(SIZE, SIZE, SEG, SEG);
    const pos = geo.attributes.position;
    const colors = new Float32Array(pos.count * 3);

    const SAND = new Col(0x6d5c46), GRASS = new Col(0x2c5733),
          GRASS2 = new Col(0x3f6b3e), ROCK = new Col(0x4d4a5c), SNOW = new Col(0xcfd6e4);
    const tmp = new Col();

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i);          // plane is XY before rotation
      const h = heightAt(x, -y);
      pos.setZ(i, h);
    }
    /* slope needs neighbouring heights, so colour in a second pass */
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = -y;
      const h = pos.getZ(i);
      const e = 1.6;
      const slope = Math.min(1, (Math.abs(heightAt(x + e, z) - h) + Math.abs(heightAt(x, z + e) - h)) / e * .8);
      const tint = fbm(x * .09, z * .09, 2);

      const shore = Math.hypot(x, z) / coastRadius(Math.atan2(z, x));
      tmp.copy(GRASS).lerp(GRASS2, tint);
      tmp.lerp(ROCK, smoothstep(.45, .95, slope));
      tmp.lerp(ROCK, smoothstep(13, 20, h) * .8);
      tmp.lerp(SNOW, smoothstep(20, 27, h));
      tmp.lerp(SAND, smoothstep(.9, .99, shore));
      tmp.multiplyScalar(.88 + tint * .24);
      colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
    }
    geo.setAttribute("color", new F32Attr(colors, 3));
    geo.computeVertexNormals();
    const island = new Mesh(geo, new StdMat({ vertexColors: true, roughness: 1, flatShading: false }));
    island.rotation.x = -Math.PI / 2;
    island.receiveShadow = true;
    island.castShadow = true;
    this.scene.add(island);
    this.island = island;

    /* ---- surf line hugging the irregular coast ---- */
    const foamGeo = new BufGeo();
    const N = 260, fArr = new Float32Array(N * 2 * 3), fUv = new Float32Array(N * 2 * 2);
    const idx = [];
    for (let i = 0; i < N; i++) {
      const a = i / (N - 1) * Math.PI * 2;
      const R = coastRadius(a);
      const ca = Math.cos(a), sa = Math.sin(a);
      fArr[i * 6] = ca * (R - 2.5); fArr[i * 6 + 1] = .06; fArr[i * 6 + 2] = sa * (R - 2.5);
      fArr[i * 6 + 3] = ca * (R + 3.5); fArr[i * 6 + 4] = -.5; fArr[i * 6 + 5] = sa * (R + 3.5);
      fUv[i * 4] = i / N * 40; fUv[i * 4 + 1] = 0;
      fUv[i * 4 + 2] = i / N * 40; fUv[i * 4 + 3] = 1;
      if (i < N - 1) { const b = i * 2; idx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2); }
    }
    foamGeo.setAttribute("position", new F32Attr(fArr, 3));
    foamGeo.setAttribute("uv", new F32Attr(fUv, 2));
    foamGeo.setIndex(idx);
    foamGeo.computeVertexNormals();
    const foam = new Mesh(foamGeo, this.bmat(0xdff0f4, {
      transparent: true, opacity: .16, side: SIDE_DOUBLE, depthWrite: false }));
    this.scene.add(foam);
    this.anims.push(t => { foam.material.opacity = .12 + Math.sin(t * 1.2) * .06; });

    /* ---- dirt paths from plaza to each temple ---- */
    this.pathSegs = [];
    for (const p of ZONE_POS) {
      const dx = p.x, dz = p.z;
      const len = Math.hypot(dx, dz) - p.r - 6;
      const ang = Math.atan2(dx, dz);
      const cx = Math.sin(ang) * (10 + len / 2), cz = Math.cos(ang) * (10 + len / 2);
      const pathTex = this.noiseTexture("#33302a", ["#2a2823", "#3d3931", "#37332c"], 160, 1);
      pathTex.repeat.set(1, Math.max(2, Math.round(len / 6)));
      const seg = this.m(new PlaneGeo(2.6, len), new StdMat({ map: pathTex, roughness: 1 }),
        cx, .05, cz, { rx: -Math.PI / 2, cast: false, recv: true });
      seg.rotation.z = -ang;
      this.pathSegs.push({ x1: 0, z1: 0, x2: dx, z2: dz });
    }

    /* ---- pond with lily pads ---- */
    const pond = new Grp(); pond.position.set(-20, 0, 12); this.scene.add(pond);
    this.m(new CircleGeo(6.5, 28), this.mat(0x123650, { roughness: .15, metalness: .5 }), 0, .06, 0, { rx: -Math.PI / 2, cast: false, parent: pond });
    this.m(new RingGeo(6.4, 7.2, 28), this.mat(0x3a3427, { roughness: 1 }), 0, .07, 0, { rx: -Math.PI / 2, cast: false, parent: pond });
    for (let i = 0; i < 5; i++) {
      const a = Math.random() * 6.28, r = 1 + Math.random() * 4.6;
      const pad = this.m(new CylGeo(.55, .55, .06, 7), this.mat(0x2f6b3c, { roughness: .8 }),
        Math.cos(a) * r, .12, Math.sin(a) * r, { cast: false, parent: pond });
      this.anims.push(t => { pad.position.y = .1 + Math.sin(t * 1.4 + i * 2) * .03; });
    }
    /* jumping fish in the pond */
    const jumper = this.m(new ConeGeo(.22, .7, 5), this.mat(0xf0a35e, { flatShading: true }), 0, -.4, 0, { parent: pond });
    this.anims.push(t => {
      const ph = (t * .7 + .3) % 3;
      if (ph < 1) {
        const y = Math.sin(ph * Math.PI) * 1.6;
        jumper.visible = true;
        jumper.position.set(Math.cos(t * .4) * 2.4, y, Math.sin(t * .4) * 2.4);
        jumper.rotation.z = ph * Math.PI * (jumper.position.x > 0 ? -1 : 1);
      } else jumper.visible = false;
    });

    this.pondPos = { x: -20, z: 12, r: 8 };
    this.buildHorizon();
  }

  /* ============ horizon ============
     Rings of mountain silhouettes at three depths. They opt out of the fog and
     carry pre-mixed atmospheric colours instead, which keeps the far distance
     reading as depth rather than as an empty backdrop behind the sea. */
  buildHorizon() {
    const rings = [
      { dist: 700, h: 96, w: 260, n: 9, col: 0x38445f, jitter: .5 },
      { dist: 1050, h: 165, w: 400, n: 8, col: 0x44506c, jitter: .4 },
      { dist: 1500, h: 250, w: 620, n: 7, col: 0x505c78, jitter: .3 }
    ];
    for (const r of rings) {
      const mat = new BasicMat({ color: r.col, fog: false });
      const snow = new BasicMat({ color: 0x8f9ab4, fog: false });
      for (let i = 0; i < r.n; i++) {
        const a = (i / r.n) * Math.PI * 2 + hash2(i, r.n) * .3;
        const d = r.dist * (1 + (hash2(i, 7) - .5) * r.jitter * .3);
        const hh = r.h * (.55 + hash2(i, 13) * .9);
        const ww = r.w * (.6 + hash2(i, 29) * .8);
        const g = new Grp();
        g.position.set(Math.cos(a) * d, -8, Math.sin(a) * d);
        g.lookAt(0, hh * .3, 0);
        this.scene.add(g);
        /* two overlapping peaks per slot so the ridgeline is not a row of cones */
        for (let k = 0; k < 2; k++) {
          const s = k ? .68 : 1;
          const peak = new Mesh(new ConeGeo(ww * .5 * s, hh * s, 4), mat);
          peak.position.set((k ? 1 : -1) * ww * .22, hh * s * .5 - 8, k * 6);
          peak.rotation.y = Math.PI / 4;
          g.add(peak);
          if (hh * s > r.h * .85) {
            const cap = new Mesh(new ConeGeo(ww * .5 * s * .3, hh * s * .22, 4), snow);
            cap.position.set(peak.position.x, hh * s * .89 - 8, peak.position.z);
            cap.rotation.y = Math.PI / 4;
            g.add(cap);
          }
        }
      }
    }
  }

  /* ============ central plaza ============ */
  buildPlaza() {
    /* mosaic floor */
    const tex = this.makeCanvas(512, 512, g => {
      g.fillStyle = "#232028"; g.fillRect(0, 0, 512, 512);
      const cols = ["#2b2732", "#332d3b", "#282434", "#3a3342"];
      for (let i = 0; i < 7; i++) {
        g.strokeStyle = cols[i % cols.length];
        g.lineWidth = 26;
        g.beginPath(); g.arc(256, 256, 40 + i * 34, 0, 7); g.stroke();
      }
      g.fillStyle = "#7fdca8";
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2;
        g.beginPath(); g.arc(256 + Math.cos(a) * 210, 256 + Math.sin(a) * 210, 9, 0, 7); g.fill();
      }
    });
    this.m(new CircleGeo(11, 40), new StdMat({ map: tex, roughness: .8 }), 0, .06, 0,
      { rx: -Math.PI / 2, cast: false, recv: true });

    /* central fountain */
    const F = new Grp(); this.scene.add(F);
    this.m(new CylGeo(3.2, 3.6, .8, 20), this.mat(0x4a4557, { roughness: .7 }), 0, .4, 0, { parent: F, recv: true });
    this.m(new CylGeo(2.6, 2.8, .5, 20), this.mat(0x123650, { roughness: .1, metalness: .6 }), 0, .85, 0, { parent: F, cast: false });
    this.m(new CylGeo(.45, .6, 2.4, 10), this.mat(0x555066, { roughness: .7 }), 0, 1.6, 0, { parent: F });
    const bowl = this.m(new CylGeo(1.15, .8, .5, 14), this.mat(0x4a4557, { roughness: .7 }), 0, 2.9, 0, { parent: F });
    /* cat statue on top — the island's deity */
    const statue = new Grp(); statue.position.y = 3.3; F.add(statue);
    const stone = this.mat(0x6a6478, { roughness: .6, metalness: .1 });
    this.m(new BoxGeo(.55, .5, .8), stone, 0, .3, 0, { parent: statue });
    this.m(new BoxGeo(.42, .4, .38), stone, 0, .75, .25, { parent: statue });
    this.m(new ConeGeo(.12, .25, 4), stone, -.14, 1.02, .25, { parent: statue });
    this.m(new ConeGeo(.12, .25, 4), stone, .14, 1.02, .25, { parent: statue });
    this.m(new CylGeo(.07, .09, .8, 6), stone, 0, .45, -.5, { parent: statue, rx: .9 });
    this.anims.push(t => { statue.rotation.y = t * .25; });
    this.scyl(3.6, 4.2, 0, 2.1, 0);
    /* fountain water jets: particle spray */
    const drops = 40;
    const geo = new BufGeo();
    const arr = new Float32Array(drops * 3);
    geo.setAttribute("position", new F32Attr(arr, 3));
    const pts = new Points3(geo, new PointsMat({ color: 0x9fd8ff, size: .32, map: this.radialTexture(), transparent: true, opacity: .85, depthWrite: false, blending: BLEND_ADD }));
    this.scene.add(pts);
    this.anims.push(t => {
      const a = pts.geometry.attributes.position.array;
      for (let i = 0; i < drops; i++) {
        const ph = (t * 1.1 + i / drops) % 1;
        const ang = i * 2.399;
        const r = .3 + ph * 1.9;
        a[i * 3] = Math.cos(ang) * r;
        a[i * 3 + 1] = 3.6 + Math.sin(ph * Math.PI) * 1.7 - ph * .8;
        a[i * 3 + 2] = Math.sin(ang) * r;
      }
      pts.geometry.attributes.position.needsUpdate = true;
    });
    this.scene.add(this.glowSprite(0x7fdca8, 4.4, new V3(0, 4.4, 0)));
    this.addLight(0, 4.6, 0, 0x7fdca8, 9, 26);

    /* physics letters R A U L — crash into them, bruno-simon style */
    const letterCols = [0x7fdca8, 0xe8b06a, 0x8fb0ff, 0xf2a2c4];
    "RAUL".split("").forEach((ch, i) => {
      const tex2 = this.makeCanvas(128, 128, g => {
        g.fillStyle = "#14161c"; g.fillRect(0, 0, 128, 128);
        g.font = '700 92px "Space Grotesk", sans-serif';
        g.textAlign = "center"; g.textBaseline = "middle";
        g.fillStyle = "#" + new Col(letterCols[i]).getHexString();
        g.fillText(ch, 64, 70);
      });
      const mesh = this.m(new BoxGeo(2, 2, 2), new StdMat({ map: tex2, roughness: .6 }),
        -6 + i * 4, 6, -16, { recv: true });
      const body = new CBody({ mass: 2.5 });
      body.addShape(new CBox(new CVec(1, 1, 1)));
      body.position.set(-6 + i * 4, 6 + i * .5, -16);
      body.quaternion.setFromEuler(0, (Math.random() - .5) * .4, 0);
      this.world.addBody(body);
      this.sync.push({ mesh, body });
    });

    /* Lamp posts ring the plaza. The angle offset keeps one off the +Z axis,
       where it would stand between the spawn camera and the cat. */
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2 + .95;
      this.lampPost(Math.cos(a) * 13.5, Math.sin(a) * 13.5);
    }
  }

  lampPost(x, z) {
    const g = new Grp(); g.position.set(x, 0, z); this.scene.add(g);
    const iron = this.mat(0x232028, { roughness: .6, metalness: .5 });
    this.m(new CylGeo(.09, .13, 3.4, 7), iron, 0, 1.7, 0, { parent: g });
    this.m(new SphGeo(.26, 10, 8), new StdMat({ color: 0xffd9a0, emissive: new Col(0xffb96a), emissiveIntensity: .85, roughness: .3 }), 0, 3.5, 0, { parent: g, cast: false });
    this.m(new ConeGeo(.4, .3, 8), iron, 0, 3.85, 0, { parent: g });
    g.add(this.glowSprite(0xffb96a, 2, new V3(0, 3.5, 0)));
    const lamp = this.addLight(x, 3.5, z, 0xffb371, 7, 17);
    /* gas-lamp wobble */
    this.anims.push(t => { lamp.intensity = 6.4 + Math.sin(t * 4.3 + x) * .5 + Math.sin(t * 9.7 + z) * .3; });
  }

  /* ============ physics playground near plaza ============ */
  buildPlayground() {
    /* crate pyramids */
    const crateCols = [0x8a5a2b, 0x7a4f24, 0x936133];
    const pyramid = (px, pz, n) => {
      for (let r = 0; r < n; r++)
        for (let c = 0; c < n - r; c++)
          this.dbox(1.3, 1.3, 1.3, px + (c - (n - r - 1) / 2) * 1.36, .68 + r * 1.33, pz,
            crateCols[(r + c) % 3], 1.8);
    };
    pyramid(14, 10, 4);
    pyramid(-13, -11, 3);

    /* bowling corner */
    for (let i = 0; i < 6; i++) {
      const row = Math.floor(i / 3), col = i % 3;
      const pin = this.m(new CylGeo(.32, .45, 1.7, 9), this.mat(0xf0ede4, { roughness: .55 }),
        17 + col * 1.1 - row * .5, .95, -8 - row * 1.1, {});
      this.m(new CylGeo(.34, .34, .22, 9), this.mat(0xd6543c), 0, .35, 0, { parent: pin });
      const body = new CBody({ mass: .7 });
      body.addShape(new CCyl(.33, .45, 1.7, 8));
      body.position.set(17 + col * 1.1 - row * .5, .95, -8 - row * 1.1);
      this.world.addBody(body);
      this.sync.push({ mesh: pin, body });
    }
    this.dsphere(.85, 12, 1, -4, 0x2f2b38, 3, { matOpts: { roughness: .3, metalness: .3 } });

    /* beach ball */
    const ball = this.dsphere(1.15, -14, 2, 14, 0xffffff, .6);
    const btex = this.makeCanvas(128, 64, g => {
      const cols = ["#f0f0ea", "#f07a6a", "#f0f0ea", "#7fdca8", "#f0f0ea", "#8fb0ff"];
      cols.forEach((c, i) => { g.fillStyle = c; g.fillRect(i * 22, 0, 22, 64); });
    });
    btex.wrapS = WRAP_REPEAT;
    ball.mesh.material = new StdMat({ map: btex, roughness: .5 });

    /* dominoes */
    for (let i = 0; i < 8; i++)
      this.dbox(.28, 2.2, 1.2, 6 + i * 1.5, 1.15, 18 + Math.sin(i * .5) * 2, 0xe8e4da, .9,
        { ry: -Math.cos(i * .5) * .35, matOpts: { roughness: .5 } });

    /* seesaw: plank balanced on a wedge (no hinge in bundle, pure physics) */
    this.m(new ConeGeo(1, 1.4, 4), this.mat(0x6a4a2f, { flatShading: true }), -8, .7, 20, {});
    this.sbox(1.4, 1.4, 1.4, -8, .6, 20);
    this.dbox(7, .3, 1.6, -8, 1.8, 20, 0x9a6a3a, 1.4, { matOpts: { roughness: .8 } });

    /* two ramps */
    const ramp = (x, z, ry) => {
      const mesh = this.m(new BoxGeo(8, 1, 5), this.mat(0x3a3f52, { roughness: .7 }), x, .9, z, { recv: true });
      const body = new CBody({ mass: 0, material: this.groundMat });
      body.addShape(new CBox(new CVec(4, .5, 2.5)));
      body.position.set(x, .9, z);
