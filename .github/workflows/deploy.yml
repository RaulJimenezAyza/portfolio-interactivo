# Builds the Next export and publishes it to GitHub Pages.
#
# The site used to be one index.html committed at the repo root, which Pages
# served straight off the branch — no build, no pipeline, nothing to go wrong.
# That is gone now that the world is a module and the models are a folder read
# at build time, so the build has to happen somewhere. Here, rather than in a
# committed out/ directory: generated output in version control goes stale the
# first time someone forgets to run it.
#
# Nothing publishes until this workflow lands on main and Pages is switched to
# "GitHub Actions" as its source in the repo settings. Until then the old
# index.html keeps serving.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run should replace a waiting one rather than
# race it, but never cancel a deploy that is already halfway out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Warnings fail it. A lint step nobody has to read is a lint step that
      # gets ignored, and the rules left on are the ones that catch a build
      # breaking rather than a style anyone has an opinion about.
      - run: npm run lint

      # The scene is plain JavaScript and the main tsconfig is strict, so it
      # gets its own pass with strict off — enough to catch a property that
      # does not exist and arithmetic on a string, which is what actually goes
      # wrong in eight thousand untyped lines.
      - run: npm run typecheck

      # The scene checks run without a browser: no DOM, no WebGL, no render
      # loop. They catch a model that floats, one that is buried, one that
      # faces backwards, an id the world reaches for that the shell does not
      # carry, and a model key with neither a file nor a builder behind it —
      # which is most of what goes wrong here.
      - run: npm run verify

      # prebuild regenerates the model manifest from whatever is in
      # public/models, so dropping a .glb in and pushing is the whole workflow.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
